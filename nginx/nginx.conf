events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types application/json application/javascript application/xml text/css text/plain;

  client_max_body_size 100k;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api_backend {
    server api:3000;
    keepalive 16;
  }

  upstream grafana_backend {
    server grafana:3000;
    keepalive 8;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /metrics {
      return 404;
    }

    location = /grafana {
      return 301 /grafana/;
    }

    location /grafana/ {
      proxy_pass http://grafana_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /api/ {
      proxy_pass http://api_backend;
      proxy_intercept_errors on;
      error_page 502 504 =503 @service_unavailable;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location = / {
      try_files /index.html =404;
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location @service_unavailable {
      default_type application/json;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable."}}';
    }
  }
}
